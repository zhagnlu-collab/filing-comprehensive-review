<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc"><title id="title">PR 方向示意：自己的修改分支提交到作者 main</title><desc id="desc">左侧 base 是作者仓库 main；右侧 compare 是自己的 Fork my-change。示意图不是网页截图。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1120" height="390" rx="20" fill="#f6f8fa"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172033"><text x="36" y="52" font-size="30" fill="#172033" font-weight="700">发起 PR 前，核对这两个位置</text><text x="36" y="89" font-size="21" fill="#475569" font-weight="400">方向：把右边自己的改动，交给左边作者审核。</text><rect x="36" y="120" width="456" height="160" rx="14" fill="white" stroke="#d0d7de"/><text x="58" y="154" font-size="22" fill="#0969da" font-weight="650">base · 接收修改</text><text x="58" y="202" font-size="23" fill="#172033" font-weight="600">zhagnlu-collab / 仓库名</text><text x="58" y="247" font-size="23" fill="#172033" font-weight="400">分支：main</text><rect x="628" y="120" width="456" height="160" rx="14" fill="white" stroke="#d0d7de"/><text x="650" y="154" font-size="22" fill="#17652d" font-weight="650">compare · 提交修改</text><text x="650" y="202" font-size="23" fill="#172033" font-weight="600">你的用户名 / 仓库名</text><text x="650" y="247" font-size="23" fill="#172033" font-weight="400">分支：my-change</text><path d="M615,201 L505,201" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="505.0,201.0 515.0,206.0 515.0,196.0" fill="#64748b"/><text x="541" y="181" font-size="22" fill="#64748b" font-weight="650">PR</text><text x="36" y="324" font-size="23" fill="#172033" font-weight="600">核对差异 → 填写修改说明 → Create pull request → 等待作者审核</text><text x="36" y="360" font-size="18" fill="#64748b" font-weight="400">操作示意图；GitHub 实际按钮位置可能随页面更新而变化。</text></g></svg>
