<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">先 Fork，再 clone 自己的 Fork：七步提交修改</title><desc id="desc">依次 Fork、clone、新建分支、修改、检查、commit 和 push、发起 PR 等待审核。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect width="1120" height="650" rx="20" fill="#f6f8fa"/><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#172033"><text x="36" y="53" font-size="32" fill="#172033" font-weight="700">先 Fork，再 clone 自己的 Fork</text><text x="36" y="91" font-size="21" fill="#475569" font-weight="400">Fork 在 GitHub 上复制仓库；clone 把自己的那份下载到电脑。</text><rect x="36" y="122" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="66" cy="153" r="17" fill="#0969da"/><text x="61" y="159" font-size="19" fill="white" font-weight="700">1</text><text x="96" y="161" font-size="24" fill="#172033" font-weight="650">Fork 到自己的账号</text><text x="58" y="205" font-size="19" fill="#475569" font-weight="400">作者的仓库 → 你的 Fork</text><text x="58" y="235" font-size="19" fill="#475569" font-weight="400">网页地址先变成你的用户名</text><rect x="398" y="122" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="428" cy="153" r="17" fill="#0969da"/><text x="423" y="159" font-size="19" fill="white" font-weight="700">2</text><text x="458" y="161" font-size="24" fill="#172033" font-weight="650">clone 自己的 Fork</text><text x="420" y="205" font-size="19" fill="#475569" font-weight="400">复制自己 Fork 的 HTTPS 地址</text><text x="420" y="235" font-size="19" fill="#475569" font-weight="400">下载后进入仓库文件夹</text><rect x="760" y="122" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="790" cy="153" r="17" fill="#0969da"/><text x="785" y="159" font-size="19" fill="white" font-weight="700">3</text><text x="820" y="161" font-size="24" fill="#172033" font-weight="650">新建修改分支</text><text x="782" y="205" font-size="19" fill="#475569" font-weight="400">git switch -c my-change</text><text x="782" y="235" font-size="19" fill="#475569" font-weight="400">给这次修改单独开一条线</text><path d="M365,193 L390,193" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="390.0,193.0 380.0,188.0 380.0,198.0" fill="#64748b"/><path d="M728,193 L752,193" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="752.0,193.0 742.0,188.0 742.0,198.0" fill="#64748b"/><path d="M1084,193 L1100,193 L1100,289 L20,289 L20,365 L29,365" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="36" y="308" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="66" cy="339" r="17" fill="#0969da"/><text x="61" y="345" font-size="19" fill="white" font-weight="700">4</text><text x="96" y="347" font-size="24" fill="#172033" font-weight="650">让 AI 修改文件</text><text x="58" y="391" font-size="19" fill="#475569" font-weight="400">在 clone 的文件夹里工作</text><text x="58" y="421" font-size="19" fill="#475569" font-weight="400">已有 ZIP 修改？复制改动进来</text><rect x="398" y="308" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="428" cy="339" r="17" fill="#0969da"/><text x="423" y="345" font-size="19" fill="white" font-weight="700">5</text><text x="458" y="347" font-size="24" fill="#172033" font-weight="650">检查修改</text><text x="420" y="391" font-size="19" fill="#475569" font-weight="400">git status + git diff</text><text x="420" y="421" font-size="19" fill="#475569" font-weight="400">再运行仓库的校验脚本</text><rect x="760" y="308" width="324" height="142" rx="14" fill="white" stroke="#d0d7de"/><circle cx="790" cy="339" r="17" fill="#0969da"/><text x="785" y="345" font-size="19" fill="white" font-weight="700">6</text><text x="820" y="347" font-size="24" fill="#172033" font-weight="650">提交并上传</text><text x="782" y="391" font-size="19" fill="#475569" font-weight="400">git add → commit → push</text><text x="782" y="421" font-size="19" fill="#475569" font-weight="400">上传到你自己的 Fork 分支</text><path d="M365,379 L390,379" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="390.0,379.0 380.0,374.0 380.0,384.0" fill="#64748b"/><path d="M728,379 L752,379" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="752.0,379.0 742.0,374.0 742.0,384.0" fill="#64748b"/><path d="M922,454 L922,487" fill="none" stroke="#64748b" stroke-width="2.5"/><polygon points="922.0,487.0 927.0,477.0 917.0,477.0" fill="#64748b"/><rect x="36" y="498" width="1048" height="112" rx="14" fill="#eaf5ed" stroke="#9ac7a4"/><text x="60" y="540" font-size="26" fill="#17652d" font-weight="700">7  发起 Pull Request（PR）</text><text x="60" y="579" font-size="22" fill="#17652d" font-weight="400">你的 Fork / my-change → 作者的仓库 / main；等待作者审核后合并。</text></g></svg>
